# This checkout runs its own scripts: Scripts/repo.py and Scripts/spdx.py are shims pointing one
# directory up, at the real ones. Nothing here is a .NET project, so there is no [dotnet] block and
# install.py writes no dotnet.py - which is the config-driven selection working on itself.
name = "devscripts"
env_prefix = "DEVSCRIPTS"

[spdx]
holder = "Pascal Klose"
licence = "GPL-3.0-or-later"

[repo]
main_branch = "master"

# Created by `repo.py init` and `repo.py labels`, next to the shared ones.

[[repo.labels]]
name = "area:dotnet"
color = "512bd4"
description = ".NET scripts"

[[repo.labels]]
name = "area:cpp"
color = "1d76db"
description = "C++ / CMake scripts"

[[repo.labels]]
name = "area:repo"
color = "0e8a16"
description = "Git and GitHub scripts"

[[repo.labels]]
name = "area:deploy"
color = "fbca04"
description = "Container deploy and servers"

[[repo.labels]]
name = "area:skills"
color = "d4c5f9"
description = "Shared skills and guideline blocks"

[[repo.labels]]
